name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  debug:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev,notebook,zarr,he-mask]"
      - name: window memory alone
        continue-on-error: true
        run: python -m pytest -p no:cacheprovider -x -s -q tests/test_window_memory.py -k ome_zarr
      - name: plane_channels then window memory
        continue-on-error: true
        run: python -m pytest -p no:cacheprovider -s -q tests/test_plane_channels.py tests/test_window_memory.py -k "ome_zarr or plane_channels or not window_memory"
      - name: from test_p onward
        continue-on-error: true
        shell: bash
        run: python -m pytest -p no:cacheprovider -s -q $(ls tests/test_*.py | sort | awk -F/ '$2 >= "test_p"')

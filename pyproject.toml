[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morphobricks-preprocessing"
version = "0.1.0"
description = "MorphoBricks preprocessing brick: per-plane intensity histograms and normalization methods for microscopy TIFFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "CellMigrationLab" }]
keywords = ["microscopy", "image analysis", "histogram", "normalization", "MorphoBricks"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7.10",
    # Per-plane histograms, the CSV table, pooling and normalization (moved there in P1).
    # Pinned to the brick's release v0.2.0, which writes plane_histograms.csv schema
    # version 3 with the channels in columns (follow-up P3b; P3b first pinned its
    # Milestone 2b merge commit 0e53e67, before the tag existed).
    "morphobricks-normalization @ git+https://github.com/CellMigrationLab/morphobricks-normalization.git@v0.2.0",
]

[project.optional-dependencies]
notebook = [
    "ipywidgets>=8",
    "matplotlib>=3.7",
]
zarr = [
    "zarr>=2.18",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.scripts]
morphobricks-preprocessing = "morphobricks_preprocessing.cli:main"

[project.urls]
Repository = "https://github.com/CellMigrationLab/morphobricks-preprocessing"

[tool.hatch.metadata]
# Needed for the git dependency on morphobricks-normalization, which is not on PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/morphobricks_preprocessing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # modern syntax for the target Python
    "NPY", # numpy-specific checks
    "D",   # docstrings
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"experiments/**" = ["D", "E501", "B905"]  # study scripts kept as they were run

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morphobricks-preprocessing"
version = "0.1.0.dev0"
description = "MorphoBricks preprocessing brick: per-plane intensity histograms and normalization methods for microscopy TIFFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "CellMigrationLab" }]
keywords = ["microscopy", "image analysis", "histogram", "normalization", "MorphoBricks"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7.10",
]

[project.optional-dependencies]
notebook = [
    "ipywidgets>=8",
    "matplotlib>=3.7",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
]

[project.urls]
Repository = "https://github.com/CellMigrationLab/morphobricks-preprocessing"

[tool.hatch.build.targets.wheel]
packages = ["src/morphobricks_preprocessing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # modern syntax for the target Python
    "NPY", # numpy-specific checks
    "D",   # docstrings
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"experiments/**" = ["D", "E501", "B905"]  # study scripts kept as they were run

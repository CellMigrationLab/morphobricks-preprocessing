[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "morphobricks-preprocessing"
version = "0.4.0rc3"
description = "MorphoBricks preprocessing brick: per-plane intensity histograms and normalization methods for microscopy TIFFs."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "CellMigrationLab" }]
keywords = ["microscopy", "image analysis", "histogram", "normalization", "MorphoBricks"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "tifffile>=2023.7.10",
    # Counting the connected pieces of each mask label in the optional mask step.
    "scipy>=1.10",
    # Per-plane histograms, the CSV table, pooling and normalization (moved there in P1).
    # Pinned to the brick's release v0.3.2, which writes plane_histograms.csv schema
    # version 4 (underflow and overflow columns, the robust histogram range and the
    # range check; follow-up P6, since v0.3.1) and, when reading it, checks each row's
    # stored plane_id, image_file and bit_depth against its other columns (data-flow
    # audit, issue #39, normalization#19). Its tag v0.3.0 holds v0.3.1's code but reports
    # version 0.2.0. Schema version 3 with the channels in columns came with v0.2.0 (P3b).
    "morphobricks-normalization @ git+https://github.com/CellMigrationLab/morphobricks-normalization.git@v0.3.2",
]

[project.optional-dependencies]
notebook = [
    "ipywidgets>=8",
    "matplotlib>=3.7",
]
zarr = [
    "zarr>=2.18",
]
dev = [
    "pytest>=7.4",
    "ruff>=0.6",
    # Running the notebook file in a real kernel (tests/test_notebook_file.py).
    "nbclient>=0.7",
    "ipykernel>=6",
]

[project.scripts]
morphobricks-preprocessing = "morphobricks_preprocessing.cli:main"

[project.urls]
Repository = "https://github.com/CellMigrationLab/morphobricks-preprocessing"

[tool.hatch.metadata]
# Needed for the git dependency on morphobricks-normalization, which is not on PyPI.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/morphobricks_preprocessing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "tools"]
extend-exclude = ["tests/guard_fixtures"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # import sorting
    "B",   # bugbear: likely bugs
    "UP",  # modern syntax for the target Python
    "NPY", # numpy-specific checks
    "D",   # docstrings
    "C90", # complexity (spec §9: at most 15)
    "PLR0913", # at most 8 parameters
    "PLR0915", # at most 50 statements
    "ANN", # complete annotations
    "PGH004", # a noqa names its rules, so the noqa ratchet sees every one
]
ignore = [
    "D105", # magic methods need no docstring
    "D107", # __init__ is documented on the class
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-statements = 50

[tool.ruff.lint.isort]
known-first-party = ["morphobricks_preprocessing", "code_rules", "check"]
# Spec §9: annotations come with postponed evaluation (I002 enforces it).
required-imports = ["from __future__ import annotations"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN", "I002"]
"experiments/**" = ["D", "E501", "B905", "ANN", "C90", "PLR", "I002"]  # study scripts kept as they were run
"notebooks/**" = ["I002"]  # notebook cells are not modules

[tool.morphobricks.code-rules]
# The shared tools/code_rules.py (spec §9), configured for this repository.
owner = "preprocessing"
package = "src/morphobricks_preprocessing"
baseline = "tools/code_rules_baseline.json"

[tool.morphobricks.code-rules.layers]
# pure: no I/O, no UI; io: reads or writes files; ui: notebook and command line, no
# computing; orchestration: ties the others together.
"morphobricks_preprocessing" = "orchestration"
"morphobricks_preprocessing.__main__" = "ui"
"morphobricks_preprocessing._io" = "io"
"morphobricks_preprocessing.axes" = "pure"

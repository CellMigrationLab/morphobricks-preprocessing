# Fixture i124_one_technical_repeat_id_two_folders
# Expected: E_SOURCE_FOLDER_CONFLICT
# Source: Owner decision of 6 Nov 2026 (fourth round)
# The technical repeat ID acq1 is declared with the folder `acquisition_1` in CTRL and `acq_1` in DrugA: one ID, one folder over the whole file (experiment-v1 4.6a).
schema = "morphobricks-experiment"
schema_version = 1

[conditions.CTRL]
source_folder = "CTRL"
display_name = "Control"

[conditions.DrugA]
source_folder = "DrugA"
display_name = "Drug A"
reference = "CTRL"
target = "SRC"
treatment_key = "saracatinib"

[channels.DNA]
display_name = "DAPI"
header_names = ["DAPI"]

[channels.ACTIN]
display_name = "F-actin"
header_names = ["Phalloidin-488"]

[repeats.rep1]
confirmed = true
confirmed_on = "2026-11-06"

[repeats.rep1.members.CTRL]
source_repeat = "rep1"
image_count = 12

[repeats.rep1.members.CTRL.technical_repeats.acq1]
source_folder = "acquisition_1"
channels = ["DNA", "ACTIN"]

[repeats.rep1.members.DrugA]
source_repeat = "rep1"
image_count = 11

[repeats.rep1.members.DrugA.technical_repeats.acq1]
source_folder = "acq_1"
channels = ["DNA", "ACTIN"]

[repeats.rep2]
confirmed = true
confirmed_on = "2026-11-06"

[repeats.rep2.members.CTRL]
source_repeat = "rep2"
image_count = 10

[repeats.rep2.members.CTRL.technical_repeats.single]
source_folder = "single"
channels = ["DNA", "ACTIN"]

[repeats.rep2.members.DrugA]
source_repeat = "rep2"
image_count = 10

[repeats.rep2.members.DrugA.technical_repeats.single]
source_folder = "single"
channels = ["DNA", "ACTIN"]

[used_ids]
conditions = ["CTRL", "DrugA"]
channels = ["ACTIN", "DNA"]
repeats = ["rep1", "rep2"]
technical_repeats = ["acq1", "single"]

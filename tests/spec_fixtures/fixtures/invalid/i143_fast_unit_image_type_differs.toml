# Fixture i143_fast_unit_image_type_differs
# Expected: E_FAST_LAYOUT_MISMATCH, E_RGB_TOKEN_MISUSE
# Paths: E_FAST_LAYOUT_MISMATCH repeats.rep2.members.DrugA.technical_repeats.single; E_RGB_TOKEN_MISUSE repeats.rep2.members.DrugA.technical_repeats.single.channels[0]; E_RGB_TOKEN_MISUSE repeats.rep2.members.DrugA.technical_repeats.single.channels[1]; E_RGB_TOKEN_MISUSE repeats.rep2.members.DrugA.technical_repeats.single.channels[2]
# Source: ADR 0006 (owner decisions FC1-FC4, 16 November 2026)
# v43 with the DrugA/rep2 unit marked `"experiment"` but without `image_type = "rgb"`: the image type is part of the materialised list (E_FAST_LAYOUT_MISMATCH), and a unit that is not rgb may not list R, G, B (E_RGB_TOKEN_MISUSE). Two rules, two codes (AQ13).
schema = "morphobricks-experiment"
schema_version = 1

[conditions.CTRL]
source_folder = "CTRL"
display_name = "Control"

[conditions.DrugA]
source_folder = "DrugA"
display_name = "Drug A"
reference = "CTRL"

[channels.R]
display_name = "Red"

[channels.G]
display_name = "Green"

[channels.B]
display_name = "Blue"

[channel_layout]
channels = ["R", "G", "B"]
image_type = "rgb"
confirmed_on = "2026-11-16"

[repeats.rep1]
confirmed = true
confirmed_on = "2026-11-16"

[repeats.rep1.members.CTRL]
source_repeat = "rep1"
image_count = 8

[repeats.rep1.members.CTRL.technical_repeats.single]
source_folder = "single"
channels = ["R", "G", "B"]
channels_from = "experiment"
image_type = "rgb"
rgb_header_override = true

[repeats.rep1.members.DrugA]
source_repeat = "rep1"
image_count = 8

[repeats.rep1.members.DrugA.technical_repeats.single]
source_folder = "single"
channels = ["R", "G", "B"]
channels_from = "experiment"
image_type = "rgb"

[repeats.rep2]
confirmed = true
confirmed_on = "2026-11-16"

[repeats.rep2.members.CTRL]
source_repeat = "rep2"
image_count = 8

[repeats.rep2.members.CTRL.technical_repeats.single]
source_folder = "single"
channels = ["R", "G", "B"]
channels_from = "experiment"
image_type = "rgb"
rgb_header_override = true

[repeats.rep2.members.DrugA]
source_repeat = "rep2"
image_count = 8

[repeats.rep2.members.DrugA.technical_repeats.single]
source_folder = "single"
channels = ["R", "G", "B"]
channels_from = "experiment"

[used_ids]
conditions = ["CTRL", "DrugA"]
channels = ["B", "G", "R"]
repeats = ["rep1", "rep2"]
technical_repeats = ["single"]

# Fixture t10_condition_id_changed_same_folder
# Expected: R_CONFIRMED_ID_CHANGED (against predecessor valid/v33, without a recorded re-confirmation)
# Source: Owner decision of 6 Nov 2026 (fourth round)
# The folder `control` was confirmed as condition `ctrl` in v33 and now carries the ID `control_cells`. A confirmed ID never changes in place, also when the folder is the same (experiment-v1 4.6, 4.6a). `ctrl` stays listed in used_ids, so only the changed ID is refused. Valid alone.
schema = "morphobricks-experiment"
schema_version = 1

[conditions.control_cells]
source_folder = "control"
display_name = "control"

[conditions.DrugA]
source_folder = "DrugA"
display_name = "Drug A"
reference = "control_cells"
target = "SRC"
treatment_key = "saracatinib"

[channels.DNA]
display_name = "DAPI"
header_names = ["DAPI"]

[channels.ACTIN]
display_name = "F-actin"
header_names = ["Phalloidin-488"]

[repeats.rep1]
confirmed = true
confirmed_on = "2026-11-06"

[repeats.rep1.members.control_cells]
source_repeat = "rep1"
image_count = 12

[repeats.rep1.members.control_cells.technical_repeats.single]
source_folder = "single"
channels = ["DNA", "ACTIN"]

[repeats.rep1.members.DrugA]
source_repeat = "rep1"
image_count = 11

[repeats.rep1.members.DrugA.technical_repeats.single]
source_folder = "single"
channels = ["DNA", "ACTIN"]

[repeats.rep2]
confirmed = true
confirmed_on = "2026-11-06"

[repeats.rep2.members.control_cells]
source_repeat = "rep2"
image_count = 10

[repeats.rep2.members.control_cells.technical_repeats.single]
source_folder = "single"
channels = ["DNA", "ACTIN"]

[repeats.rep2.members.DrugA]
source_repeat = "rep2"
image_count = 10

[repeats.rep2.members.DrugA.technical_repeats.single]
source_folder = "single"
channels = ["DNA", "ACTIN"]

[used_ids]
conditions = ["DrugA", "control_cells", "ctrl"]
channels = ["ACTIN", "DNA"]
repeats = ["rep1", "rep2"]
technical_repeats = ["single"]

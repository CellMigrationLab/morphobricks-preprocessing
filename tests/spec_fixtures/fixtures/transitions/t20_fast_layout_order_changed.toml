reference = "CTRL"

[channels.DNA]
display_name = "Nuclei stain"
header_names = ["DAPI", "Hoechst 33342"]

[channels.ACTIN]
display_name = "F-actin"
header_names = ["Phalloidin-488"]

[channel_layout]
channels = ["ACTIN", "DNA"]
confirmed_on = "2026-11-17"

